# In-cluster MinIO for local practice. Prod replaced object storage with S3
# + IRSA (see k8s/10-config.yaml, k8s/30-backend.yaml) — here the backend
# talks to the in-cluster Service (minio:9000) with the access/secret key
# pair in the local Secret, same as docker-compose.yml.
#
# Service is LoadBalancer, not ClusterIP: put_object() returns links built
# from MINIO_PUBLIC_ENDPOINT (http://localhost:9000) that the *browser*
# fetches directly, so it has to be reachable from the host, not just pods.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: social
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: social
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - { containerPort: 9000, name: api }
            - { containerPort: 9001, name: console }
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: social-secret, key: MINIO_ACCESS_KEY } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: social-secret, key: MINIO_SECRET_KEY } } }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: minio-data }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: social }
spec:
  type: LoadBalancer
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
# One-shot bucket creation + public download policy, mirroring the
# `minio-init` service in docker-compose.yml.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: social
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:latest
          env:
            - { name: MINIO_ACCESS_KEY, valueFrom: { secretKeyRef: { name: social-secret, key: MINIO_ACCESS_KEY } } }
            - { name: MINIO_SECRET_KEY, valueFrom: { secretKeyRef: { name: social-secret, key: MINIO_SECRET_KEY } } }
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY"; do sleep 2; done
              mc mb --ignore-existing local/media
              mc anonymous set download local/media
