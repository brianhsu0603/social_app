# 4-node MinIO distributed setup with erasure coding (2 data + 2 parity).
# Tolerates one node loss with no read/write impact. In real prod, use a real
# S3 (AWS S3, GCS, R2) — this is here so the cluster boots end-to-end.
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: social }
spec:
  clusterIP: None
  selector: { app: minio }
  ports:
    - { name: api, port: 9000, targetPort: 9000 }
    - { name: console, port: 9001, targetPort: 9001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: minio, namespace: social }
spec:
  serviceName: minio
  replicas: 4
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app: minio } }
      containers:
        - name: minio
          image: minio/minio:latest
          args:
            - server
            - http://minio-{0...3}.minio.social.svc.cluster.local/data
            - --console-address
            - :9001
          ports:
            - { containerPort: 9000 }
            - { containerPort: 9001 }
          env:
            - { name: MINIO_ROOT_USER, valueFrom: { secretKeyRef: { name: social-secret, key: MINIO_ACCESS_KEY } } }
            - { name: MINIO_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: social-secret, key: MINIO_SECRET_KEY } } }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            initialDelaySeconds: 30
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            initialDelaySeconds: 60
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 50Gi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: minio-pdb, namespace: social }
spec:
  minAvailable: 3
  selector: { matchLabels: { app: minio } }
