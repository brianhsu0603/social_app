apiVersion: v1
kind: Namespace
metadata:
  name: social
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: social-config
  namespace: social
data:
  APP_ENV: production

  # Backend still talks to PgBouncer (in-cluster); PgBouncer talks to RDS.
  DATABASE_URL: postgresql+psycopg://social:social@pgbouncer:5432/social

  MONGO_DB: social_chat

  KAFKA_CHAT_TOPIC: chat.messages
  KAFKA_EVENTS_TOPIC: social.events
  KAFKA_CONSUMER_GROUP: social-app
  # Replace with: terraform output -raw msk_bootstrap_brokers_sasl_scram
  KAFKA_BOOTSTRAP_SERVERS: "REPLACE_WITH_MSK_BOOTSTRAP_BROKERS"
  KAFKA_USERNAME: social

  # S3 replaces MinIO. The backend pod IRSA role grants s3:PutObject/GetObject,
  # so no access key is needed — the AWS SDK picks up credentials automatically.
  MINIO_ENDPOINT: "s3.amazonaws.com"
  # Replace with: terraform output -raw media_bucket_name
  MINIO_BUCKET: "REPLACE_WITH_MEDIA_BUCKET_NAME"
  MINIO_PUBLIC_ENDPOINT: "https://media.example.com"
  MINIO_SECURE: "true"

  MEILI_URL: http://meilisearch:7700
  CORS_ORIGINS: "https://app.example.com"
---
apiVersion: v1
kind: Secret
metadata:
  name: social-secret
  namespace: social
type: Opaque
stringData:
  # RDS credentials — used by PgBouncer
  POSTGRES_USER: social
  POSTGRES_PASSWORD: REPLACE_WITH_RDS_PASSWORD
  POSTGRES_DB: social

  # DocumentDB connection string with TLS. Replace the endpoint and password.
  # Download the RDS CA bundle into your container image:
  #   curl -O https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
  # Replace with: terraform output -raw documentdb_endpoint
  MONGO_URL: "mongodb://social:REPLACE_WITH_DOCDB_PASSWORD@REPLACE_WITH_DOCDB_ENDPOINT:27017/?tls=true&tlsCAFile=/etc/ssl/certs/global-bundle.pem&replicaSet=rs0&readPreference=secondaryPreferred"

  # ElastiCache Redis with TLS + AUTH. Replace endpoint and auth token.
  # Replace with: terraform output -raw elasticache_primary_endpoint
  REDIS_URL: "rediss://:REPLACE_WITH_REDIS_AUTH_TOKEN@REPLACE_WITH_ELASTICACHE_ENDPOINT:6379/0"

  # MSK SASL/SCRAM password
  KAFKA_PASSWORD: REPLACE_WITH_MSK_PASSWORD

  SECRET_KEY: change-me-in-prod-please
  MEILI_MASTER_KEY: change-me-in-prod-please

  # Push provider creds — empty values trigger dry-run logging in push_service.
  FCM_PROJECT_ID: ""
  FCM_ACCESS_TOKEN: ""
  APNS_JWT: ""
  APNS_BUNDLE_ID: ""
