apiVersion: v1
kind: ConfigMap
metadata:
  name: social-config
  namespace: social
data:
  APP_ENV: production
  DATABASE_URL: postgresql+psycopg://social:social@postgres:5432/social
  MONGO_URL: mongodb://mongo:27017
  MONGO_DB: social_chat
  REDIS_URL: redis://redis:6379/0
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  KAFKA_CHAT_TOPIC: chat.messages
  KAFKA_EVENTS_TOPIC: social.events
  KAFKA_CONSUMER_GROUP: social-app
  MINIO_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: http://localhost:9000
  MINIO_BUCKET: media
  MINIO_SECURE: "false"
  CORS_ORIGINS: "*"
---
apiVersion: v1
kind: Secret
metadata:
  name: social-secret
  namespace: social
type: Opaque
stringData:
  SECRET_KEY: change-me-in-prod-please
  POSTGRES_USER: social
  POSTGRES_PASSWORD: social
  POSTGRES_DB: social
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
