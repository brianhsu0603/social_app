apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meili-data
  namespace: social
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meilisearch
  namespace: social
spec:
  serviceName: meilisearch
  replicas: 1
  selector: { matchLabels: { app: meilisearch } }
  template:
    metadata: { labels: { app: meilisearch } }
    spec:
      containers:
        - name: meilisearch
          image: getmeili/meilisearch:v1.10
          ports: [{ containerPort: 7700 }]
          env:
            - { name: MEILI_ENV, value: production }
            - { name: MEILI_MASTER_KEY, valueFrom: { secretKeyRef: { name: social-secret, key: MEILI_MASTER_KEY } } }
          volumeMounts:
            - { name: data, mountPath: /meili_data }
          readinessProbe:
            httpGet: { path: /health, port: 7700 }
            initialDelaySeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: meili-data }
---
apiVersion: v1
kind: Service
metadata:
  name: meilisearch
  namespace: social
spec:
  selector: { app: meilisearch }
  ports: [{ port: 7700, targetPort: 7700 }]
