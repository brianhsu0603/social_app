# PostgreSQL is now managed by RDS (see terraform/rds.tf).
# PgBouncer stays in-cluster: it sits between EKS pods and RDS and keeps
# connection counts low when the backend autoscales to 20+ replicas.
#
# Set DB_HOST to the value of `terraform output rds_endpoint` before applying.

apiVersion: apps/v1
kind: Deployment
metadata: { name: pgbouncer, namespace: social }
spec:
  replicas: 2
  selector: { matchLabels: { app: pgbouncer } }
  template:
    metadata: { labels: { app: pgbouncer } }
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:1.23.1
          ports: [{ containerPort: 5432 }]
          env:
            - name: DB_HOST
              # Replace with: terraform output -raw rds_endpoint
              value: "REPLACE_WITH_RDS_ENDPOINT"
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: social-secret, key: POSTGRES_USER } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: social-secret, key: POSTGRES_PASSWORD } }
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: social-secret, key: POSTGRES_DB } }
            - { name: POOL_MODE, value: transaction }
            - { name: MAX_CLIENT_CONN, value: "1000" }
            - { name: DEFAULT_POOL_SIZE, value: "25" }
            # RDS PostgreSQL requires SSL; enforce it here so plaintext never reaches the DB.
            - { name: SERVER_TLS_SSLMODE, value: require }
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata: { name: pgbouncer, namespace: social }
spec:
  selector: { app: pgbouncer }
  ports: [{ port: 5432, targetPort: 5432 }]
