# ServiceAccount for backend pods. The IRSA annotation lets EKS inject AWS
# credentials so pods can access S3 and Secrets Manager without static keys.
# Replace the role ARN with: terraform output -raw backend_pod_role_arn
apiVersion: v1
kind: ServiceAccount
metadata:
  name: social-backend
  namespace: social
  annotations:
    eks.amazonaws.com/role-arn: "REPLACE_WITH_BACKEND_POD_ROLE_ARN"
---
# Migration job runs to completion every deploy (alembic is idempotent).
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: social
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: social-backend
      containers:
        - name: migrate
          image: REPLACE_WITH_ECR_BACKEND_URL:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: social-config }
            - secretRef: { name: social-secret }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: social
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0    # always keep full capacity during a deploy
      maxSurge: 1
  selector: { matchLabels: { app: backend } }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
    spec:
      serviceAccountName: social-backend
      # Give the pod time to drain in-flight requests before SIGKILL.
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: backend } }
      affinity:
        podAntiAffinity:
          # Soft preference: spread replicas across nodes.
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app: backend } }
      containers:
        - name: backend
          image: REPLACE_WITH_ECR_BACKEND_URL:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: social-config }
            - secretRef: { name: social-secret }
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318
            - name: OTEL_SERVICE_NAME
              value: social-backend
            # MSK SASL/SCRAM password — username comes from social-config ConfigMap
            - name: KAFKA_PASSWORD
              valueFrom: { secretKeyRef: { name: social-secret, key: KAFKA_PASSWORD } }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            failureThreshold: 30
            periodSeconds: 2
          lifecycle:
            preStop:
              # Let LB drop us from the pool before we start refusing new conns.
              exec: { command: ["sh", "-c", "sleep 10"] }
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: social
spec:
  selector: { app: backend }
  ports: [{ port: 80, targetPort: 8000 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: social
spec:
  minAvailable: 2
  selector: { matchLabels: { app: backend } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: social
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - { type: Percent, value: 100, periodSeconds: 30 }
---
# Each worker is its own deployment so it scales and fails independently
# of the HTTP path.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: events-worker
  namespace: social
spec:
  replicas: 2
  selector: { matchLabels: { app: events-worker } }
  template:
    metadata: { labels: { app: events-worker } }
    spec:
      serviceAccountName: social-backend
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: REPLACE_WITH_ECR_BACKEND_URL:latest
          command: ["python", "-m", "app.workers.events_consumer"]
          envFrom:
            - configMapRef: { name: social-config }
            - secretRef: { name: social-secret }
          env:
            - name: KAFKA_PASSWORD
              valueFrom: { secretKeyRef: { name: social-secret, key: KAFKA_PASSWORD } }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 1, memory: 1Gi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: events-worker-pdb, namespace: social }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: events-worker } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcode-worker
  namespace: social
spec:
  replicas: 2
  selector: { matchLabels: { app: transcode-worker } }
  template:
    metadata: { labels: { app: transcode-worker } }
    spec:
      serviceAccountName: social-backend
      tolerations:
        - key: workload
          value: compute
          effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
        - name: worker
          image: REPLACE_WITH_ECR_BACKEND_URL:latest
          command: ["python", "-m", "app.workers.transcode_worker"]
          envFrom:
            - configMapRef: { name: social-config }
            - secretRef: { name: social-secret }
          env:
            - name: KAFKA_PASSWORD
              valueFrom: { secretKeyRef: { name: social-secret, key: KAFKA_PASSWORD } }
          # ffmpeg is CPU and RAM heavy; tune for your media sizes.
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "2", memory: 3Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: transcode-worker-hpa, namespace: social }
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: transcode-worker
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
