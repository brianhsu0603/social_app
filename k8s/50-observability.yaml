# Bare-minimum metrics + tracing for this app. In a real cluster you'd use
# kube-prometheus-stack and a managed APM, but this is self-contained.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: social
data:
  prometheus.yml: |
    global: { scrape_interval: 15s }
    scrape_configs:
      - job_name: backend
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [social] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: backend
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8000"
      - job_name: events-worker
        kubernetes_sd_configs:
          - role: pod
            namespaces: { names: [social] }
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: events-worker
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: social }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: prometheus-social }
rules:
  - apiGroups: [""]
    resources: [pods, endpoints, services, nodes, nodes/metrics, nodes/proxy]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: prometheus-social }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus-social }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: social }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: social }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=14d
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: social }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: social }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports: [{ containerPort: 3000 }]
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Admin }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: social }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
---
# Jaeger all-in-one is fine for dev/staging. In prod, use Tempo / Jaeger
# with persistent storage and the OTel collector in front.
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: social }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          env:
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
          ports:
            - { containerPort: 16686, name: ui }
            - { containerPort: 4318, name: otlp-http }
---
apiVersion: v1
kind: Service
metadata: { name: jaeger, namespace: social }
spec:
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: 16686 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
