# Default deny everything ingress; whitelist explicit flows.
# Requires a CNI that enforces NetworkPolicies (Calico, Cilium, etc.).
#
# Note: Postgres (RDS), Redis (ElastiCache), MongoDB (DocumentDB), and Kafka
# (MSK) are no longer pods in this cluster. Access to those services is
# controlled by Terraform security groups (terraform/security_groups.tf),
# which restrict inbound traffic to EKS nodes only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: social
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Backend accepts traffic only from the ingress controller and other backend pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-backend, namespace: social }
spec:
  podSelector: { matchLabels: { app: backend } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
        - podSelector: { matchLabels: { app: backend } }
      ports:
        - { port: 8000, protocol: TCP }
---
# PgBouncer: backend and workers only (they use DATABASE_URL → pgbouncer:5432).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-pgbouncer, namespace: social }
spec:
  podSelector: { matchLabels: { app: pgbouncer } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
        - podSelector: { matchLabels: { app: events-worker } }
        - podSelector: { matchLabels: { app: transcode-worker } }
      ports: [{ port: 5432, protocol: TCP }]
---
# Meilisearch: backend and events-worker only (search indexing + queries).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-meilisearch, namespace: social }
spec:
  podSelector: { matchLabels: { app: meilisearch } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: backend } }
        - podSelector: { matchLabels: { app: events-worker } }
      ports: [{ port: 7700, protocol: TCP }]
---
# Frontend is the public face — reachable from the ingress controller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-frontend, namespace: social }
spec:
  podSelector: { matchLabels: { app: frontend } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } }
      ports: [{ port: 80, protocol: TCP }]
