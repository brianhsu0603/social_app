# Redis with Sentinel for HA. One primary, two replicas, three sentinels.
# Loses the primary → sentinels promote a replica within seconds.
# For larger scale, switch to Redis Cluster or a managed Redis with HA.
apiVersion: v1
kind: ConfigMap
metadata: { name: redis-config, namespace: social }
data:
  redis.conf: |
    appendonly yes
    save 60 1000
    maxmemory-policy allkeys-lru
  sentinel.conf: |
    sentinel monitor mymaster redis-0.redis 6379 2
    sentinel down-after-milliseconds mymaster 5000
    sentinel failover-timeout mymaster 10000
    sentinel parallel-syncs mymaster 1
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: social }
spec:
  clusterIP: None
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: redis, namespace: social }
spec:
  serviceName: redis
  replicas: 3
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app: redis } }
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "/etc/redis/redis.conf"]
          ports: [{ containerPort: 6379 }]
          volumeMounts:
            - { name: config, mountPath: /etc/redis }
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
      volumes:
        - { name: config, configMap: { name: redis-config } }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis-sentinel, namespace: social }
spec:
  replicas: 3
  selector: { matchLabels: { app: redis-sentinel } }
  template:
    metadata: { labels: { app: redis-sentinel } }
    spec:
      containers:
        - name: sentinel
          image: redis:7-alpine
          command: ["redis-sentinel", "/etc/redis/sentinel.conf"]
          ports: [{ containerPort: 26379 }]
          volumeMounts:
            - { name: config, mountPath: /etc/redis }
      volumes:
        - { name: config, configMap: { name: redis-config } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: redis-pdb, namespace: social }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: redis } }
