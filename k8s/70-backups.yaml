# Supplementary logical backups to S3.
#
# RDS automated backups handle point-in-time recovery (7-day retention,
# configured in terraform/rds.tf). This CronJob adds an extra logical
# pg_dump export to S3 — useful for cross-region restores or data audits.
#
# DocumentDB automated backups (terraform/documentdb.tf) cover MongoDB.
# A separate mongodump job is not necessary.
#
# The backup pod uses the social-backend ServiceAccount, which has the
# IRSA policy granting s3:PutObject on the backups bucket.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: social
spec:
  schedule: "0 3 * * *"   # 03:00 UTC daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: social-backend
          containers:
            - name: backup
              image: bitnami/postgresql:16
              env:
                # PgBouncer sits in front of RDS; dump directly from RDS to
                # avoid going through the pool. Set PGHOST to RDS endpoint.
                - name: PGHOST
                  value: "REPLACE_WITH_RDS_ENDPOINT"
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: social-secret, key: POSTGRES_USER } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: social-secret, key: POSTGRES_PASSWORD } }
                - name: PGDATABASE
                  valueFrom: { secretKeyRef: { name: social-secret, key: POSTGRES_DB } }
                - name: PGSSLMODE
                  value: require
                # Replace with: terraform output -raw backups_bucket_name
                - name: BACKUPS_BUCKET
                  value: "REPLACE_WITH_BACKUPS_BUCKET_NAME"
                - name: AWS_DEFAULT_REGION
                  value: "us-east-1"
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  FILE=/tmp/social-$TS.sql.gz
                  pg_dump --no-owner --no-privileges | gzip -9 > "$FILE"
                  # aws CLI is available in bitnami/postgresql; credentials come
                  # from the IRSA-injected token on the ServiceAccount.
                  aws s3 cp "$FILE" "s3://${BACKUPS_BUCKET}/postgres/$TS.sql.gz"
                  rm "$FILE"
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: 500m, memory: 512Mi }
