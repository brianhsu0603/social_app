# Daily logical backup of Postgres → MinIO. Cheap, simple, restorable.
# For real disaster recovery, layer in pgBackRest / WAL archiving for PITR.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: social
spec:
  schedule: "0 3 * * *"   # 03:00 UTC daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: bitnami/postgresql:16
              envFrom:
                - secretRef: { name: social-secret }
              env:
                - { name: PGHOST, value: postgres }
                - { name: PGUSER, value: social }
                - { name: PGPASSWORD, valueFrom: { secretKeyRef: { name: social-secret, key: POSTGRES_PASSWORD } } }
                - { name: PGDATABASE, value: social }
                - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: social-secret, key: MINIO_ACCESS_KEY } } }
                - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: social-secret, key: MINIO_SECRET_KEY } } }
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  FILE=/tmp/social-$TS.sql.gz
                  pg_dump --no-owner --no-privileges | gzip -9 > $FILE
                  # mc is preinstalled in bitnami/postgresql? If not, swap to an image that has it.
                  apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
                  curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
                  chmod +x /usr/local/bin/mc
                  mc alias set s3 http://minio:9000 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
                  mc mb --ignore-existing s3/backups
                  mc cp $FILE s3/backups/postgres/
---
# Mongo backup. Same idea.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongo-backup
  namespace: social
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: mongo:7
              env:
                - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: social-secret, key: MINIO_ACCESS_KEY } } }
                - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: social-secret, key: MINIO_SECRET_KEY } } }
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  mongodump --uri mongodb://mongo:27017 --gzip --archive=/tmp/mongo-$TS.gz
                  apt-get update && apt-get install -y --no-install-recommends curl ca-certificates
                  curl -sSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc
                  chmod +x /usr/local/bin/mc
                  mc alias set s3 http://minio:9000 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
                  mc mb --ignore-existing s3/backups
                  mc cp /tmp/mongo-$TS.gz s3/backups/mongo/
